[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff-core-preview"
version = "0.1.0.dev0"
description = "Review-only local handoff draft and export core; not a native compaction runtime"
requires-python = ">=3.11"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[project.scripts]
handoff-core = "handoff_core.__main__:main"

[tool.setuptools.packages.find]
include = ["handoff_core*"]
